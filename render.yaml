# Render Blueprint — the off-chain backend: the tree lives in an append-only log
# on a persistent disk and people sign in with passkeys (see src/offchain.ts).
# Disks need a paid instance, hence the starter plan; with a disk Render stops
# the old instance before starting the new one, so a deploy has a few seconds
# of downtime. Render injects $PORT (App.ts reads process.env.PORT) and
# auto-deploys on every push to main.
services:
  - type: web
    name: anthill-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node build/App.js
    disk:
      name: anthill-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      # passkeys are bound to the frontend's domain
      - key: RP_ID
        value: anthilldao.dev
      - key: ORIGINS
        value: https://anthilldao.dev
      # admin endpoints (log download for backups, bootstrap invites); Render
      # generates the value, copy it from the dashboard when you need it
      - key: ADMIN_TOKEN
        generateValue: true
      # Google sign-in (see src/google.ts): an OAuth client of type "Web
      # application" in Google Cloud, with https://anthilldao.dev/auth/google
      # as an authorised redirect URI. Set both in the dashboard; without them
      # Google sign-in is off and the site only offers passkeys.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # set to "true" once real members can invite everyone else
      - key: INVITE_ONLY
        value: "false"
      # Client IPs (for rate limits) are the X-Forwarded-For entry Render's
      # proxy adds, skipping Cloudflare's hops. After a deploy, check the
      # "client IPs:" line in the log; if it shows the setup differs, set
      # TRUSTED_PROXY_HOPS (proxies that add an entry) or TRUST_CLOUDFLARE=true
      # (use CF-Connecting-IP, only if Cloudflare always overwrites it here).

      # The builders community's coordinator runs inside this service, as a
      # child process (src/commonsEmbed.ts): commons.config.json says which
      # communities, what they build and who signs off their kernel; the
      # "agent-commons" dependency in package.json pins its code. It is on
      # here because Render sets RENDER=true (COMMONS_EMBED=false turns it
      # off), keeps its ledger and keys in /var/data/commons/<community>, and
      # agents reach it at https://<this service>/commons/<community>/.
      # A community COMMONS_SITES names below uses that commons instead.

      # The GitHub token a commons whose config sets "pushUpstream": true
      # pushes its dev and main with (the coordinator's merges and
      # promotions): a fine-grained token for that one repository, Contents
      # read/write only. Set it in the dashboard; without it nothing is
      # pushed and the commons runs as before.
      - key: COMMONS_GITHUB_TOKEN
        sync: false

      # Communities with an agent commons elsewhere (see src/commonsAgents.ts): a JSON
      # object {"<community id>": {"coordinator": "https://...", "site":
      # "https://...", "repo": "https://..."}}, coordinator the commons API,
      # site its playground (may be the same), repo (optional) the target
      # repository agents clone. Operator config only: the backend makes
      # requests to the coordinator. Without it no community has agents; a
      # malformed value stops the server at startup. Each community must be
      # public: agents (agent.md) and the coordinator (the signed tree) read
      # it without signing in; Anthill pairs no agents in a private one and
      # warns at startup. URLs given to agents use Render's
      # RENDER_EXTERNAL_URL unless PUBLIC_URL is set.
      - key: COMMONS_SITES
        sync: false
      # The agent kit's commit agents install (40 hex), after reviewing its
      # diff; unset, DEFAULT_KIT_COMMIT in src/commonsAgents.ts.
      - key: COMMONS_KIT_COMMIT
        sync: false
