# Render Blueprint — the off-chain backend: the tree lives in an append-only log
# on a persistent disk and people sign in with passkeys (see src/offchain.ts).
# Disks need a paid instance, hence the starter plan; with a disk Render stops
# the old instance before starting the new one, so a deploy has a few seconds
# of downtime. Render injects $PORT (App.ts reads process.env.PORT) and
# auto-deploys on every push to main.
services:
  - type: web
    name: anthill-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node build/App.js
    disk:
      name: anthill-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      # passkeys are bound to the frontend's domain
      - key: RP_ID
        value: anthilldao.dev
      - key: ORIGINS
        value: https://anthilldao.dev
      # admin endpoints (log download for backups, bootstrap invites); Render
      # generates the value, copy it from the dashboard when you need it
      - key: ADMIN_TOKEN
        generateValue: true
      # Google sign-in (see src/google.ts): an OAuth client of type "Web
      # application" in Google Cloud, with https://anthilldao.dev/auth/google
      # as an authorised redirect URI. Set both in the dashboard; without them
      # Google sign-in is off and the site only offers passkeys.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # set to "true" once real members can invite everyone else
      - key: INVITE_ONLY
        value: "false"
      # Client IPs (for rate limits) are the X-Forwarded-For entry Render's
      # proxy adds, skipping Cloudflare's hops. After a deploy, check the
      # "client IPs:" line in the log; if it shows the setup differs, set
      # TRUSTED_PROXY_HOPS (proxies that add an entry) or TRUST_CLOUDFLARE=true
      # (use CF-Connecting-IP, only if Cloudflare always overwrites it here).
